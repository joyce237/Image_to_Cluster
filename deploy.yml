- name: Deploy custom nginx on K3d
  hosts: localhost
  connection: local
  tasks:
    - name: Create deployment
      command: kubectl create deployment custom-nginx --image=custom-nginx:1.0

    - name: Set image pull policy to Never
      command: kubectl patch deployment custom-nginx -p '{"spec":{"template":{"spec":{"containers":[{"name":"custom-nginx","imagePullPolicy":"Never"}]}}}}'

    - name: Expose service
      command: kubectl expose deployment custom-nginx --type=NodePort --port=80

    - name: Wait for deployment
      command: kubectl rollout status deployment/custom-nginx
